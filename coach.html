<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مدربك الذكي</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f5f7fa, #e4e8ee);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER */
.header {
  background: #111;
  color: white;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.header .title {
  font-weight: bold;
}

.header .status {
  font-size: 12px;
  color: #4caf50;
}

/* CHAT */
.chat {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

/* BUBBLES */
.message {
  max-width: 70%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 18px;
  line-height: 1.5;
}

.user {
  background: #007bff;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.bot {
  background: white;
  color: #333;
  margin-right: auto;
  border-bottom-left-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  background: #fff;
  border-top: 1px solid #ddd;
}

.input-area input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

.input-area button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #111;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}

.input-area button:hover {
  background: #333;
}
</style>
</head>

<body>

<div class="header">
  <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <div>
    <div class="title">مدربك الذكي 💪</div>
    <div class="status">متصل الآن</div>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="اكتب رسالتك...">
  <button onclick="sendMessage()">إرسال</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
